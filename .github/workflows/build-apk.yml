name: Build Nabdh Academy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q NabdhAcademy-v5-APK-BUILD.zip
          cd NabdhAcademy-v5
          ls

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create local.properties
        run: |
          cd NabdhAcademy-v5
          cat > local.properties <<'PROPS'
          sdk.dir=${ANDROID_HOME}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PROPS

      - name: Build APK
        run: |
          cd NabdhAcademy-v5
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nabdh-academy-debug-apk
          path: NabdhAcademy-v5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
